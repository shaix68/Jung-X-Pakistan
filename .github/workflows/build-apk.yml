name: Build APK and Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the uploaded project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip
            cp -r JungXpakistan/. .
          fi

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export Windows EXE
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-release "Windows Desktop" build/JungXpakistan.exe

      - uses: actions/upload-artifact@v4
        with:
          name: JungXpakistan-windows-exe
          path: build/JungXpakistan.exe

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK parts (SDK is preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Debug keystore and Godot editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<SET
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SET

      - name: Export Android APK
        run: |
          godot --headless --export-debug "Android" build/JungXpakistan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JungXpakistan-apk
          path: build/JungXpakistan.apk
