# Builds an installable Android APK of JungXpakistan with GitHub Actions (free for public repos).
# Put this file at  <repo root>/.github/workflows/build-apk.yml . The Godot project can be at the repo root, in a
# subfolder, OR still inside a .zip file in the repo (the workflow unzips it). If several zips exist the highest
# version name is used (e.g. ..._v5.zip beats ....zip).
# Run: Actions tab > "Build Android APK" > Run workflow. Then download the "JungXpakistan-apk" artifact.
# The APK is a DEBUG build signed with an auto-generated debug key (fine for installing on your own phone).
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  APK_NAME: "JungXpakistan.apk"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the Godot project (extracted folder, or a .zip of it)
        run: |
          PF=$(find . -name project.godot -not -path "*/.godot/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$PF" ]; then
            echo "No project.godot in the repo files, looking for a project .zip"
            ZIP=$(find . -name "*.zip" -not -path "./.git/*" | sort -V | tail -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No project.godot and no .zip found. Upload the JungXpakistan project (folder or zip) to the repo."
              find . -maxdepth 3 -not -path "./.git/*" | head -50
              exit 1
            fi
            echo "Using zip: $ZIP"
            mkdir -p /tmp/gameproj
            unzip -q -o "$ZIP" -d /tmp/gameproj
            PF=$(find /tmp/gameproj -name project.godot -not -path "*/.godot/*" | head -n 1)
            if [ -z "$PF" ]; then
              echo "::error::The zip $ZIP has no project.godot inside."
              exit 1
            fi
          fi
          PROJ=$(cd "$(dirname "$PF")" && pwd)
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Godot project: $PROJ"
          ls -la "$PROJ"

      - name: Make sure the Android export preset exists
        run: |
          if [ ! -f "$PROJ/export_presets.cfg" ]; then
            echo "export_presets.cfg missing, creating the Android preset"
            cat > "$PROJ/export_presets.cfg" << 'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/JungXpakistan.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.jungxpakistan.game"
          package/name="JungXpakistan"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/internet=false
          PRESET
          fi
          grep -n 'name="Android"' "$PROJ/export_presets.cfg"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make sure the Android SDK parts Godot needs are present
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/platform-tools" ]; then
            yes | sudo "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          fi
          ls "$SDK/build-tools"

      - name: Download Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Import project resources
        run: godot --headless --path "$PROJ" --import || true

      - name: Create debug keystore and Godot editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # let Godot create its own editor settings file first, then append the Android options to it
          godot --headless --editor --quit --path "$PROJ" || true
          mkdir -p "$HOME/.config/godot"
          SET=$(ls "$HOME"/.config/godot/editor_settings-*.tres 2>/dev/null | head -n 1)
          if [ -z "$SET" ]; then
            SET="$HOME/.config/godot/editor_settings-4.3.tres"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SET"
          fi
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >> "$SET"
          echo "Editor settings file: $SET"
          tail -n 8 "$SET"

      - name: Export debug APK
        run: |
          mkdir -p "$PROJ/build"
          godot --headless --path "$PROJ" --export-debug "Android" "$PROJ/build/$APK_NAME"
          ls -la "$PROJ/build"

      - name: Check the APK exists
        run: test -s "$PROJ/build/$APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JungXpakistan-apk
          path: ${{ env.PROJ }}/build/JungXpakistan.apk
          if-no-files-found: error
